<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PermitPilot - Contract &amp; Permit Review</title>
  <meta name="description" content="AI-assisted contract and permit review checklist for project managers.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213D'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23E8590C' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F3A68"/><path d="M9 16.5l4.5 4.5L23 11" stroke="#E8590C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>Permit<span>Pilot</span></div>
      </div>
      <div class="tagline">AI-assisted contract &amp; permit review checklist</div>
      <div class="spacer"></div>
      <div class="actions" id="topActions" hidden>
        <button class="btn btn-ghost-light" data-action="load-sample">Load sample project</button>
        <button class="btn btn-ghost-light" data-action="reset-review" title="Clear verify/dismiss/notes for this browser session">Reset review</button>
      </div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
    <div class="viewer-head">
      <div><h2 id="viewerTitle">Source document</h2><div class="sub" id="viewerSub"></div></div>
      <button class="btn btn-ghost-light" data-action="close-viewer">Close ✕</button>
    </div>
    <div class="viewer-status" id="viewerStatus"></div>
    <div class="viewer-body" id="viewerBody"></div>
  </dialog>

  <footer class="footer"><span>⚠</span> AI-assisted review. Verify with qualified professionals. Not legal advice.</footer>

  <!-- Offline fallback (used when opened from file:// or analysis.json can't be fetched). Built by: npm run bundle -->
  <script src="sample-bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
